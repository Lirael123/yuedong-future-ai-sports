name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Yuedong logic tests
        run: npm run test:yuedong
      - name: Coze gateway contract tests
        run: npm run test:coze
      - name: Generate fixed authored reference video
        run: |
          python3 -m pip install --quiet pillow imageio-ffmpeg
          python3 scripts/generate-standard-reference.py
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_COACH_API_URL: ${{ vars.COACH_API_URL }}
      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  smoke-browser:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/yuedong-integrated-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for acceptance smoke test
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Generate fixed authored reference video
        run: |
          python3 -m pip install --quiet pillow imageio-ffmpeg
          python3 scripts/generate-standard-reference.py
      - name: Build preview
        run: npm run build
        env:
          NODE_ENV: production
      - name: Browser checks
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/yuedong-future-ai-sports/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-browser.cjs
      - name: Fetch public standing long jump footage (test only)
        run: |
          curl -fLSs --retry 3 --connect-timeout 20 --max-time 120 \
            "https://paralympics.ie/wp-content/uploads/Standing-long-jump-side.mp4" \
            -o /tmp/slj-public-fixture.mp4
          test $(stat -c%s /tmp/slj-public-fixture.mp4) -gt 10000
      - name: Run real-video MediaPipe end-to-end acceptance
        env:
          SLJ_VIDEO_FILE: /tmp/slj-public-fixture.mp4
        run: node scripts/real-video-acceptance.cjs
      - name: Upload real-video JSON result (no source media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuedong-real-video-acceptance
          path: real-video-acceptance.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuedong-browser-preview
          path: smoke-*.png
          if-no-files-found: ignore

